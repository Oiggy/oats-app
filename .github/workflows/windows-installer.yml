name: Build Windows Installer (Any Branch)

# Runs by hand (Actions > Run workflow, any branch) and, through
# windows-installer-development.yml, on every push to development.
#
# Versions
# - Every build of `development` is a new release: the version goes up by one
#   (1.0.0, 1.0.1, 1.0.2, ...), is tagged vX.Y.Z on the commit it was built
#   from, and is published as a GitHub Release with the installer attached.
# - To move to a new minor/major version, raise "version" in package.json
#   (e.g. to 1.1.0) on development; the next development build uses it.
# - Builds of any other branch are test builds, versioned after the next
#   release with the branch and run number, e.g. 1.0.3-feature-x.12. They are
#   not tagged or released.
# The version is shown in the app (bottom-right of the dashboard) and by
# Windows under Installed apps / Programs and Features, with the publisher.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    # Two development builds at once (a push and a manual run) would both
    # claim the same version, so they take turns
    concurrency:
      group: oats-windows-installer-${{ github.ref_name == 'development' && 'development' || github.run_id }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags, to work out the next version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Speech-in-Noise tasks fit psychometric functions with Python
      # (psignifit). Freeze the scripts into one self-contained program,
      # shipped in the installer as resources/psychometric/, so the lab PC
      # needs no Python (see src/shared/psychometric/psychometric-runner.js).
      - name: Set up Python (psychometric fitting)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/shared/psychometric/requirements.txt

      - name: Build the psychometric fitting program
        shell: bash
        run: |
          python -m pip install -r src/shared/psychometric/requirements.txt pyinstaller==6.22.3
          pyinstaller --noconfirm --clean --onedir --name oats-psychometric \
            --distpath build-psychometric --workpath build-psychometric/work --specpath build-psychometric \
            --paths src/shared/psychometric --exclude-module tkinter \
            src/shared/psychometric/oats_psychometric.py

      - name: Check the psychometric fitting program
        shell: bash
        run: |
          exe=build-psychometric/oats-psychometric/oats-psychometric.exe
          mkdir -p build-psychometric/check && cd build-psychometric/check
          cat > summary.csv <<'EOF'
          SNR,Non-words,Words,HINT,CST
          25,19,20,18/20,30/32
          20,18,19,17/20,29/32
          15,15,17,14/20,25/32
          10,10,13,10/20,18/32
          5,5,8,6/20,10/32
          0,2,3,2/20,4/32
          -5,,,1/20,1/32
          EOF
          sed -i 's/^ *//' summary.csv
          # Known answer for these scores: 90% correct at 16.4 dB -> start at 20 dB
          words=$("../../$exe" sin summary.csv words.png Words | tr -d '\r')
          echo "Words recommended SNR: $words"
          [ "$words" = "20" ] || { echo "Expected 20"; exit 1; }
          "../../$exe" sin summary.csv nonwords.png Non-words
          "../../$exe" hint summary.csv hint.png
          "../../$exe" cst summary.csv cst.png
          for f in words nonwords hint cst; do [ -s "$f.png" ] || { echo "No $f.png"; exit 1; }; done
          echo "Psychometric fitting program works"

      - name: Work out the version
        shell: bash
        run: |
          base=$(node -p "require('./package.json').version")
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          latest=${latest#v}
          if [ -z "$latest" ]; then
            next=$base
          else
            IFS=. read -r major minor patch <<< "$latest"
            bumped="$major.$minor.$((patch + 1))"
            # package.json wins when it was raised past the last release
            next=$(node -e "
              const [a, b] = process.argv.slice(1).map((v) => v.split('.').map(Number));
              const d = a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
              console.log((d > 0 ? a : b).join('.'));
            " "$base" "$bumped")
          fi

          if [ "$GITHUB_REF_NAME" = "development" ]; then
            version=$next
            release=true
          else
            branch=$(echo "$GITHUB_REF_NAME" | sed 's/[^A-Za-z0-9-]/-/g')
            version="$next-$branch.$GITHUB_RUN_NUMBER"
            release=false
          fi

          npm version "$version" --no-git-tag-version --allow-same-version
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          echo "PREVIOUS_TAG=${latest:+v$latest}" >> "$GITHUB_ENV"
          echo "Building OATS $version"

      - name: Build Windows installer
        run: npm run build-win -- --publish never
        env:
          CI: true

      - name: Check the installer includes the psychometric fitting program
        shell: bash
        run: |
          test -f dist/win-unpacked/resources/psychometric/oats-psychometric.exe \
            || { echo "resources/psychometric/oats-psychometric.exe missing from the app"; exit 1; }

      - name: Compute branch-safe artifact name
        shell: bash
        run: echo "SAFE_BRANCH=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_ENV"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oats-windows-installer-${{ env.SAFE_BRANCH }}-${{ env.VERSION }}
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

      - name: Tag and publish the release (development only)
        if: env.RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"

          {
            echo "OATS $VERSION, built from development at ${GITHUB_SHA::7}."
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since $PREVIOUS_TAG:"
              git log --first-parent --format='- %s' "$PREVIOUS_TAG..$GITHUB_SHA"
            fi
          } > release-notes.md

          gh release create "$tag" dist/*.exe --title "OATS $VERSION" --target "$GITHUB_SHA" --notes-file release-notes.md
