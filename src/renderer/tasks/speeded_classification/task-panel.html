<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speeded Classification Task</title>
</head>
<body>
    <div class="task-container">
        <!-- Task Header -->
        <header class="task-header">
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="progress-text">
                    <span id="current-phase">Preparing...</span>
                    <span id="trial-counter">0/0</span>
                </div>
            </div>
        </header>

        <!-- Main Task Area -->
        <main class="task-main">
            <div class="content-container">
                <!-- Loading Screen -->
                <div class="screen loading-screen active" id="loading-screen">
                    <div class="loading-content">
                        <div class="loading-spinner"></div>
                        <h2>Loading Speeded Classification Task</h2>
                        <p id="loading-status">Initializing...</p>
                    </div>
                </div>

                <!-- Instructions Screen -->
                <div class="screen instruction-screen" id="instruction-screen">
                    <div class="instruction-content">
                        <h2 id="instruction-title">Task Instructions</h2>
                        <div id="instruction-text"></div>
                        <button class="primary-button" id="start-button">Start</button>
                    </div>
                </div>

                <!-- Phase Transition Screen -->
                <div class="screen transition-screen" id="transition-screen">
                    <div class="transition-content">
                        <h2 id="transition-title">Phase Complete</h2>
                        <p id="transition-message"></p>
                        <button class="primary-button" id="continue-button">Continue</button>
                    </div>
                </div>

                <!-- Trial Screen -->
                <div class="screen trial-screen" id="trial-screen">
                    <!-- Pre-stimulus -->
                    <div class="trial-state" id="pre-stimulus">
                        <div class="fixation-cross">+</div>
                    </div>

                    <!-- Stimulus Presentation -->
                    <div class="trial-state" id="stimulus-presentation">
                        <div class="stimulus-container">
                            <div class="audio-indicator">
                                <div class="audio-icon">🔊</div>
                                <div class="audio-waves">
                                    <span></span>
                                    <span></span>
                                    <span></span>
                                </div>
                            </div>
                            <p class="stimulus-instruction">Listen carefully...</p>
                        </div>
                    </div>

                    <!-- Response Collection -->
                    <div class="trial-state" id="response-collection">
                        <div class="response-container">
                            <p class="response-prompt" id="response-prompt">Make your choice:</p>
                            <div class="response-buttons">
                                <button class="response-button" id="response-1" data-response="1">
                                    <span id="button-1-label">B</span>
                                </button>
                                <button class="response-button" id="response-2" data-response="2">
                                    <span id="button-2-label">P</span>
                                </button>
                            </div>
                            <div class="timeout-indicator">
                                <div class="timeout-bar" id="timeout-bar"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Feedback -->
                    <div class="trial-state" id="feedback">
                        <div class="feedback-container">
                            <div class="feedback-icon" id="feedback-icon">✓</div>
                            <div class="feedback-text" id="feedback-text">Correct!</div>
                        </div>
                    </div>
                </div>

                <!-- Task Complete Screen -->
                <div class="screen complete-screen" id="complete-screen">
                    <div class="complete-content">
                        <div class="complete-icon">🎉</div>
                        <h2>Task Completed!</h2>
                        <p>Thank you for participating in the Speeded Classification Task.</p>
                        <div class="results-summary" id="results-summary"></div>
                        <button class="primary-button" id="finish-button">Finish</button>
                    </div>
                </div>

                <!-- Error Screen -->
                <div class="screen error-screen" id="error-screen">
                    <div class="error-content">
                        <div class="error-icon">⚠️</div>
                        <h2>Task Error</h2>
                        <p id="error-message">An error occurred during the task.</p>
                        <button class="secondary-button" id="retry-button">Retry</button>
                        <button class="primary-button" id="exit-button">Exit Task</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Audio Element -->
        <audio id="stimulus-audio" preload="auto"></audio>
    </div>

    <script src="task-controller.js"></script>
</body>
</html>
